# Vite production output. Without this, Netlify publishes the repo root
# and serves ./index.tsx, which browsers cannot run (blank screen).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API to Vercel BEFORE the SPA catch-all. The browser POSTs to
# same-origin /api/*; Netlify forwards those to the serverless host.
# Keep this block first. Also keep public/_redirects in the same order:
# Vite copies that file into dist, and Netlify evaluates it before this file.
[[redirects]]
  from = "/api/*"
  to = "https://aama-removals.vercel.app/api/:splat"
  status = 200
  force = true

# Existing files (hashed /assets/*) are served first; this covers SPA routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
